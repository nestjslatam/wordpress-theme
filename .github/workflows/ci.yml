name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxis PHP
        run: |
          for f in functions.php inc/*.php; do
            echo "  $f"
            php -l "$f" > /dev/null
          done

      - name: El zip se construye y trae la carpeta raíz
        run: |
          ./build.sh
          zip=$(ls dist/*.zip)
          # WordPress rechaza un zip sin carpeta raíz, así que se comprueba.
          unzip -l "$zip" | grep -q 'nestjslatam/style.css' \
            || { echo "el zip no tiene la carpeta raíz esperada"; exit 1; }

      - name: Ningún color a pelo fuera de tokens.css
        run: |
          # Un hex suelto en un componente rompe el modo oscuro sin avisar.
          if grep -rnE '#[0-9a-fA-F]{3,8}\b' assets/css --include='*.css' \
               | grep -v '^assets/css/tokens.css:'; then
            echo
            echo "Usa una variable de tokens.css en vez de un color literal."
            exit 1
          fi

      - name: La versión no está escrita a mano en functions.php
        run: |
          # Un ?ver= congelado deja a los visitantes con CSS viejo durante
          # max-age sin que nada lo delate. Ya pasó una vez.
          if grep -qE "define\(\s*'NESTJSLATAM_VERSION',\s*'[0-9]" functions.php; then
            echo "NESTJSLATAM_VERSION está escrita a mano; léela de style.css."
            exit 1
          fi

      - name: Los dos menús llevan los mismos destinos
        run: python3 scripts/comparar-menus.py

      - name: Cada plantilla referenciada existe
        run: |
          # El atajo [nl_pagina nombre="x"] falla en silencio si plantillas/x.php
          # no está: la página sale vacía y nada lo delata.
          python3 - <<'PY'
          import re, pathlib, sys
          gen = pathlib.Path('contenido/generar-wxr.py').read_text()
          nombres = {f[:-5] for f in re.findall(r"'([a-z-]+\.html)'", gen)}
          falta = [n for n in nombres if not pathlib.Path(f'plantillas/{n}.php').exists()]
          if falta:
              print('  plantillas que faltan:', ', '.join(sorted(falta))); sys.exit(1)
          print(f'  ✓ las {len(nombres)} plantillas existen')
          PY

      - name: Sin emoji en la interfaz
        run: |
          # El diseño es minimalista: un emoji en una tarjeta baja el registro
          # de todo lo que lo rodea. Se cuelan con facilidad al pegar contenido.
          python3 - <<'PY'
          import pathlib, re, sys
          EMOJI = re.compile('[\U0001F300-\U0001FAFF☀-➿\U0001F1E6-\U0001F1FF]')
          malos = []
          for d in ('inc', 'plantillas'):
              for f in pathlib.Path(d).rglob('*.php'):
                  for n, linea in enumerate(f.read_text().splitlines(), 1):
                      if EMOJI.search(linea):
                          malos.append(f'{f}:{n}')
          if malos:
              print('  emoji encontrados en:')
              for m in malos: print(f'    {m}')
              sys.exit(1)
          print('  ✓ sin emoji')
          PY
